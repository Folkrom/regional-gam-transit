# Pesos del score compuesto, calibrados a mano para el perfil "cafeteria".
# El flujo de transporte pesa mas porque el caso de uso es cafe de camino
# al trabajo.
#
# No tienen que sumar 1: como todas las variables ya estan normalizadas a
# 0-1, lo que importa es la proporcion relativa entre pesos. El score final
# no esta acotado y no hace falta que lo este, solo se usa para ordenar.
#
# El transporte pesa 0.35 repartido entre dos variables que responden
# preguntas distintas: flujo_transporte es cuanta gente pasa (afluencia del
# Metro, la unica publicada por estacion) y presencia_transporte es si hay
# estacion (geometria de OSM, que si cubre el Cablebus). El total del bloque
# no subio: si presencia entrara encima de un flujo intacto, diluiria en
# silencio el peso relativo de las otras seis variables.
weights:
  flujo_transporte: 0.25
  presencia_transporte: 0.10
  densidad_pob: 0.15
  nivel_socioeconomico: 0.15
  accesibilidad_peatonal: 0.10
  atractores_denue: 0.10
  atractores_osm: 0.05
  competencia: -0.10
