[project]
name = "rtgam"
version = "0.1.0"
description = "Analisis de flujo peatonal para ubicacion de cafeteria en Gustavo A. Madero"
requires-python = ">=3.12"
dependencies = [
    "h3>=4.0",
    "pandas>=2.2",
    "numpy>=1.26",
    # Solo para el grafo de calles de la fuente OSM: Dijkstra acotado desde los
    # 724 centroides. Es Python puro, sin extensiones compiladas. Se prefirio
    # sobre osmnx, que hace lo mismo mejor pero arrastra geopandas, pyproj,
    # rtree y scikit-learn, y cachea por su cuenta en paralelo al patron del
    # proyecto.
    "networkx>=3.0",
    "shapely>=2.0",
    # Acotado a proposito, no por comodidad. pyarrow 25.0.0 revienta con
    # SIGSEGV dentro del hilo de scripts de Streamlit: el proceso se cae solo
    # a los pocos segundos, sin traceback, y de forma intermitente (3 de cada
    # 5 arranques). Medido con 6 corridas por version: 21.0.0 da 0 crashes,
    # 25.0.0 da 3 de 5. Las versiones 22 a 24 no se probaron.
    # Para volver a subir el techo: correr el dashboard 6+ veces seguidas y
    # confirmar que ninguna sale con codigo 139. Una sola corrida no basta,
    # el fallo es una carrera.
    "pyarrow>=21,<22",
    "requests>=2.32",
    "PyYAML>=6.0",
    "streamlit>=1.49",
    "folium>=0.17",
    "streamlit-folium>=0.23",
    "branca>=0.8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rtgam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
